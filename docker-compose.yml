services:
  # ============================================
  # Configuration A: 35B MoE (no MTP)
  # Best for Qwen3.6-35B-A3B / similar MoE models
  # Build 9870+, RADV_DEBUG=nocompute, flash-attn
  # ============================================
  llama-35b:
    image: llama-cpp-vulkan:latest   # your custom Vulkan build
    container_name: llama-35b
    restart: unless-stopped
    ports:
      - "30001:8080"
    volumes:
      - /path/to/your/models:/models  # change to your model directory
    devices:
      - /dev/dri:/dev/dri
    group_add:
      - video
    environment:
      - GGML_VK_VISIBLE_DEVICES=0
      - RADV_DEBUG=nocompute           # REQUIRED for RDNA4 gfx1201
    command: >
      --model /models/Qwen3.6-35B-A3B-Q4_K.gguf
      --alias Qwen3.6-35B-Q4K
      --host 0.0.0.0
      --port 8080
      --n-gpu-layers 999
      --ctx-size 32768
      --parallel 1
      --flash-attn on
      -b 4096
      -ub 512
      --cache-type-k q4_0
      --cache-type-v q4_0
      --api-key your-api-key
      --metrics

  # ============================================
  # Configuration B: 27B Dense (with MTP)
  # Best for Qwen3.6-27B / Qwen3.8-27B / similar dense models
  # MTP speculative decoding gives ~2× speedup
  # 2026-10-04: draft width 2 -> 4 measured +18-29% decode (mean accepted length 3.0 -> 4.9);
  #             DFlash2 (config C below) measured +30%..+63% and is the long-context winner.
  # ============================================
  llama-27b:
    image: llama-cpp-vulkan:latest
    container_name: llama-27b
    restart: unless-stopped
    ports:
      - "30002:8080"
    volumes:
      - /path/to/your/models:/models
    devices:
      - /dev/dri:/dev/dri
    group_add:
      - video
    environment:
      - GGML_VK_VISIBLE_DEVICES=0
      - RADV_DEBUG=nocompute           # REQUIRED for RDNA4 gfx1201
    command: >
      --model /models/Qwen3.6-27B-Q4_K_M.gguf
      --alias Qwen3.6-27B-Q4K_M
      --host 0.0.0.0
      --port 8080
      --n-gpu-layers 999
      --ctx-size 204800
      --parallel 1
      --flash-attn on
      -b 16384
      -ub 2048
      --cache-type-k q4_0
      --cache-type-v q4_0
      --spec-type draft-mtp
      --spec-draft-n-max 2
      --spec-draft-p-min 0.10
      --api-key your-api-key
      --metrics

  # ============================================
  # Configuration C: 27B Dense + DFlash2 block-diffusion drafter
  # USE ONLY FOR CODE / COPY / STRUCTURED OUTPUT. Measured 2026-10-04:
  #   code generation   68.55 t/s vs 49.22 (MTP n-max 2)   WIN
  #   verbatim copy     73.32 t/s vs 49.64                 WIN
  #   Chinese prose     24.73 t/s vs 36.98                 LOSS -33%
  #   social copy       18.13 t/s vs 29.69                 LOSS -39%
  #   24K doc summarise 23.52 t/s vs 32.43                 LOSS -27%
  # The drafter is trained on the NON-abliterated target; acceptance collapses on free-form prose
  # (0.08-0.32) while staying high on code (0.80). Costs +1.85 GB VRAM, <=2% of prefill.
  # Needs llama.cpp build 10820+ (PR #27342). Drafter: z-lab/Qwen3.8-27B-DFlash2-GGUF (Q4_K_M).
  # ============================================
  llama-27b-dflash:
    image: llama-cpp-vulkan:latest
    container_name: llama-27b-dflash
    restart: unless-stopped
    ports:
      - "30003:8080"
    volumes:
      - /path/to/your/models:/models
    devices:
      - /dev/dri:/dev/dri
    group_add:
      - video
    environment:
      - GGML_VK_VISIBLE_DEVICES=0
      - RADV_DEBUG=nocompute           # REQUIRED for RDNA4 gfx1201
    command: >
      --model /models/Qwen3.8-27B-Q4_K_M.gguf
      --model-draft /models/Qwen3.8-27B-DFlash2-Q4_K_M.gguf
      --spec-draft-ngl 999
      --spec-draft-type-k f16
      --spec-draft-type-v f16
      --alias Qwen3.8-27B-Q4K_M
      --host 0.0.0.0
      --port 8080
      --n-gpu-layers 999
      --ctx-size 262144
      --parallel 1
      --flash-attn on
      -b 16384
      -ub 2048
      --cache-type-k q4_0
      --cache-type-v q4_0
      --spec-type draft-dflash
      --spec-draft-n-max 7
      --api-key your-api-key
      --metrics
